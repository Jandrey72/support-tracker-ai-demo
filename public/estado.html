<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Estado de su solicitud — Mi Empresa</title>
    <style>
      /* Página PÚBLICA: la ve el cliente, sin usuario ni contraseña.
         Solo muestra lo que el servidor decide enseñar (ver /api/publico). */
      :root {
        --fondo: #f1f5f9; --tarjeta: #fff; --texto: #0f172a; --suave: #64748b;
        --linea: #e2e8f0; --azul: #2563eb; --verde: #16a34a; --ambar: #d97706;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --fondo: #0b1220; --tarjeta: #111a2e; --texto: #e2e8f0; --suave: #94a3b8;
          --linea: #1e293b; --azul: #60a5fa; --verde: #4ade80; --ambar: #fbbf24;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--fondo); color: var(--texto);
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        padding: 32px 16px;
      }
      .marca { font-size: 20px; font-weight: 900; letter-spacing: -.02em; margin-bottom: 20px; }
      .marca span { color: var(--azul); }
      .tarjeta {
        background: var(--tarjeta); border-radius: 16px; width: 100%; max-width: 520px;
        padding: 28px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 10px 30px rgba(0,0,0,.05);
      }
      .num { color: var(--suave); font-size: 13px; font-variant-numeric: tabular-nums; }
      h1 { font-size: 22px; margin: 6px 0 4px; line-height: 1.25; }
      .empresa { color: var(--suave); font-size: 14px; }
      .estado {
        display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
        font-weight: 700; font-size: 15px; padding: 8px 14px; border-radius: 999px;
      }
      .e-ok { background: color-mix(in srgb, var(--verde) 15%, transparent); color: var(--verde); }
      .e-prog { background: color-mix(in srgb, var(--azul) 15%, transparent); color: var(--azul); }
      .e-open { background: color-mix(in srgb, var(--ambar) 15%, transparent); color: var(--ambar); }

      /* Línea de tiempo: recibido → en atención → resuelto */
      .pasos { list-style: none; margin: 24px 0 8px; }
      .paso { display: flex; gap: 14px; position: relative; padding-bottom: 20px; }
      .paso:last-child { padding-bottom: 0; }
      .paso::before {
        content: ''; position: absolute; left: 11px; top: 26px; bottom: 0; width: 2px; background: var(--linea);
      }
      .paso:last-child::before { display: none; }
      .punto {
        width: 24px; height: 24px; border-radius: 50%; flex: none; display: grid; place-items: center;
        border: 2px solid var(--linea); background: var(--tarjeta); font-size: 12px; color: #fff;
      }
      .hecho .punto { background: var(--verde); border-color: var(--verde); }
      .actual .punto { border-color: var(--azul); box-shadow: 0 0 0 4px color-mix(in srgb, var(--azul) 20%, transparent); }
      .paso b { display: block; font-size: 14px; }
      .paso small { color: var(--suave); font-size: 13px; }
      .pendiente b { color: var(--suave); font-weight: 500; }

      .bloque { border-top: 1px solid var(--linea); margin-top: 20px; padding-top: 16px; }
      .bloque h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--suave); margin-bottom: 6px; }
      .bloque p { font-size: 15px; line-height: 1.5; }
      .pie { color: var(--suave); font-size: 12px; text-align: center; margin-top: 20px; max-width: 520px; line-height: 1.5; }
      .error { text-align: center; padding: 20px 0; }
      .error b { display: block; font-size: 17px; margin-bottom: 6px; }
      .error p { color: var(--suave); font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="marca">TIC<span>GLOBAL</span></div>
    <main class="tarjeta" id="tarjeta" aria-live="polite">
      <div class="error"><p>Cargando…</p></div>
    </main>
    <p class="pie">
      Esta página se actualiza sola. Si tiene dudas, escríbanos por el grupo de soporte de siempre.<br />
      Mi Empresa
    </p>

    <script>
      function esc(s) {
        if (s == null) return '';
        return String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
      }
      function fecha(f) {
        return f ? new Date(f).toLocaleString('es-MX', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : '';
      }

      const ESTADO = {
        open: ['e-open', '🕐', 'Recibido, en espera de atención'],
        in_progress: ['e-prog', '🔧', 'En atención'],
        completed: ['e-ok', '✅', 'Resuelto'],
      };

      function pintar(t) {
        const [cls, icono, texto] = ESTADO[t.estado] || ESTADO.open;
        const orden = { open: 0, in_progress: 1, completed: 2 }[t.estado] ?? 0;
        const paso = (i, titulo, detalle) => {
          const clase = i < orden || (i === 2 && orden === 2) ? 'hecho' : i === orden ? 'actual' : 'pendiente';
          return `<li class="paso ${clase}"><span class="punto">${clase === 'hecho' ? '✓' : ''}</span>
            <div><b>${titulo}</b>${detalle ? `<small>${detalle}</small>` : ''}</div></li>`;
        };

        document.getElementById('tarjeta').innerHTML = `
          <div class="num">Solicitud ${esc(t.ticketNumber || '')}</div>
          <h1>${esc(t.resumen)}</h1>
          <div class="empresa">${esc(t.empresa)}${t.categoria ? ' · ' + esc(t.categoria) : ''}</div>
          <div class="estado ${cls}">${icono} ${texto}</div>
          <ol class="pasos">
            ${paso(0, 'Recibimos su solicitud', esc(fecha(t.recibido)))}
            ${paso(1, 'Nuestro equipo la está atendiendo', t.atiende && orden >= 1 ? 'Atiende: ' + esc(t.atiende) : '')}
            ${paso(2, 'Resuelto', esc(fecha(t.resuelto)))}
          </ol>
          ${t.solucion ? `<div class="bloque"><h2>Qué se hizo</h2><p>${esc(t.solucion)}</p></div>` : ''}
          <div class="bloque"><small style="color:var(--suave);font-size:12px;">Última actualización: ${esc(fecha(t.actualizado))}</small></div>`;
      }

      function error(titulo, detalle) {
        document.getElementById('tarjeta').innerHTML =
          `<div class="error"><b>${esc(titulo)}</b><p>${esc(detalle)}</p></div>`;
      }

      async function cargar() {
        const codigo = location.pathname.split('/').filter(Boolean).pop() || '';
        try {
          const res = await fetch('/api/publico/estado/' + encodeURIComponent(codigo));
          if (res.status === 404) return error('Este link no es válido', 'Puede que haya expirado. Pídanos uno nuevo por el grupo de soporte.');
          if (!res.ok) return error('No pudimos consultar el estado', 'Intente de nuevo en un momento.');
          pintar(await res.json());
        } catch {
          error('Sin conexión', 'Revise su internet e intente de nuevo.');
        }
      }

      cargar();
      setInterval(() => { if (!document.hidden) cargar(); }, 60000);
    </script>
  </body>
</html>
